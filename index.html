<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Manager</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
   <header>
  <h1>Event Manager</h1>
  <p style="font-size:1.3rem; opacity:0.9; margin:15px 0;">Manage & Discover Amazing Events</p>
  <a href="add-event.html" class="btn">Add New Event</a>

  <!-- DARK MODE TOGGLE -->
  <button id="theme-toggle" class="btn" style="margin-left:20px; background:#333;">
    <span id="mode-icon">Moon</span> Dark Mode
  </button>
</header>

    <h2>All Events</h2>
    <div id="events-list" class="event-grid">
      Loading events...
    </div>
  </div>

  <script src="js/main.js"></script>
  <script>
    loadEvents(); // from main.js
  </script>
  <script>
  // Dark Mode Toggle
  const toggle = document.getElementById('theme-toggle');
  const icon = document.getElementById('mode-icon');

  // Check saved theme
  if (localStorage.getItem('theme') === 'dark' || 
      (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
    document.body.classList.add('dark');
    icon.textContent = 'Light Mode';
  } else {
    icon.textContent = 'Dark Mode';
  }

  toggle.addEventListener('click', () => {
    document.body.classList.toggle('dark');
    
    if (document.body.classList.contains('dark')) {
      icon.textContent = 'Light Mode';
      localStorage.setItem('theme', 'dark');
    } else {
      icon.textContent = 'Dark Mode';
      localStorage.setItem('theme', 'light');
    }
  });
</script>
</body>
</html>
