<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"width=device-width, initial-scale=1.0">
  <title>Add New Event - Event Manager</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <header style="margin-bottom: 2rem; padding: 2rem;">
      <h1 style="font-size: 3rem;">Add New Event</h1>
      <p style="font-size: 1.3rem; opacity: 0.9;">Create an amazing event that everyone will love!</p>
      <a href="index.html" class="btn" style="background: #6c5ce7; margin-top: 10px;">Back to Events</a>
    </header>

    <div class="form-container">
      <form id="eventForm">
        <div class="input-group">
          <label>Event Title <span class="required">*</span></label>
          <input type="text" id="title" placeholder="e.g. Annual Tech Fest 2025" required>
        </div>

        <div class="input-group">
          <label>Date <span class="required">*</span></label>
          <input type="date" id="date" required>
        </div>

        <div class="input-group">
          <label>Location</label>
          <input type="text" id="location" placeholder="e.g. Main Auditorium">
        </div>

        <div class="input-group">
          <label>Description (Optional)</label>
          <textarea id="description" rows="5" placeholder="Tell everyone why they should join this event..."></textarea>
        </div>

        <button type="submit" class="submit-btn">
          Create Event
        </button>
      </form>
    </div>
  </div>

  <!-- Fixed JavaScript -->
  <script>
    document.getElementById('eventForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const eventData = {
        title: document.getElementById('title').value.trim(),
        date: document.getElementById('date').value,
        location: document.getElementById('location').value.trim() || "TBA",
        description: document.getElementById('description').value.trim()
      };

      // Basic validation
      if (!eventData.title || !eventData.date) {
        alert('Please fill in Title and Date!');
        return;
      }

      try {
        const response = await fetch('https://codveda-level1-project-internship-kq7f.onrender.com/api/events ', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify(eventData)
        });

        if (response.ok) {
          alert('Event created successfully!');
          window.location.href = 'index.html';  // Redirect to home
        } else {
          const error = await response.json();
          alert('Failed: ' + (error.message || 'Unknown error'));
        }
      } catch (err) {
        console.error(err);
        alert('Network error! Is your backend running on port 5000?');
      }
    });
  </script>
</body>
</html>
